; Atom modem: Psion-tuned WiFi/USB modem firmware. MIT licence (see LICENSE
; at the top of the repository). Read docs/UPGRADE.md, section 1 (safety),
; before wiring anything to a Psion.
;   pio run -e atoms3-lite              build for the M5Stack AtomS3 Lite (ESP32-S3)
;   pio run -e atoms3-lite -t upload    build and flash over USB-C (device mode)
;   pio run -e atoms3r                  build for the M5Stack AtomS3R (ESP32-S3, 8 MB PSRAM)
;   pio run -e m5stack-atom             build for the plain Atom Lite/Matrix (as 1.x)
;   pio device monitor                  the USB console, 115200 baud (device mode)
; The host tests are in hosttest/ (make -C hosttest test).
; No libraries beyond the Arduino core are used; each core is pinned below.

[platformio]
default_envs = atoms3-lite
src_dir = src

; Everything the modem does (src/*.cpp) is plain C++; the board side is
; src/board and main.cpp. The picture converter compiles PsiMail's decoders
; (../../mail/engine/img) and zlib's inflate (../../ssh/zlib) in place.
[common]
build_flags =
	-Wall -Wextra -Wno-unused-parameter
	-DAM_FIRMWARE=1
	-I../../mail/engine/img
	-I../../ssh/zlib
	-DZ_SOLO -DNO_GZIP
build_src_filter =
	+<*>
	+<../../../mail/engine/img/pmimg.c>
	+<../../../mail/engine/img/pmjpeg.c>
	+<../../../mail/engine/img/pmjprog.c>
	+<../../../mail/engine/img/pmpng.c>
	+<../../../mail/engine/img/pmgif.c>
	+<../../../mail/engine/img/picojpeg.c>
	+<../../../ssh/zlib/inflate.c>
	+<../../../ssh/zlib/inftrees.c>
	+<../../../ssh/zlib/inffast.c>
	+<../../../ssh/zlib/adler32.c>
	+<../../../ssh/zlib/crc32.c>
	+<../../../ssh/zlib/zutil.c>

; The AtomS3 Lite: ESP32-S3, 8 MB flash, no PSRAM, native USB (host mode
; for a phone or a USB Ethernet device). Arduino-ESP32 3.1.3 on ESP-IDF 5.3
; through the pioarduino platform, pinned by its release.
[env:atoms3-lite]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = m5stack-atoms3
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
	${common.build_flags}
	-DAM_BOARD_ATOMS3_LITE=1
	-DAM_USB_HOST=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = ${common.build_src_filter}

; The AtomS3R: as the AtomS3 Lite (same SoC, flash, header and USB), plus
; 8 MB of octal PSRAM (ESP32-S3-PICO-1-N8R8). The board definition is the
; AtomS3's with the memory type set to qio_opi (QIO flash, octal PSRAM),
; which picks the core's PSRAM-enabled library set; BOARD_HAS_PSRAM lets
; the firmware use it (board/boards.h, main.cpp, imgconv.cpp). With that
; set the core's malloc puts blocks of 4 KB and more in PSRAM when it is
; found, and still boots if it is not. Not yet tried on hardware.
[env:atoms3r]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = m5stack-atoms3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
	${common.build_flags}
	-DAM_BOARD_ATOMS3R=1
	-DAM_USB_HOST=1
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = ${common.build_src_filter}

; The plain Atom Lite/Matrix (ESP32), as 1.x: no USB host. Arduino-ESP32
; 2.0.17 through the espressif32 platform.
[env:m5stack-atom]
platform = espressif32@6.9.0
board = m5stack-atom
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
	${common.build_flags}
	-DAM_BOARD_ATOM=1
build_src_filter = ${common.build_src_filter}
